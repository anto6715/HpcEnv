[[language]]
name = "yaml"
auto-format = false

[[language]]
name = "bash"
auto-format = false
language-servers = ["bash-language-server"]

formatter = {command = "shfmt", args = ["-i", "4"]}

[[language]]
name = "python"
auto-format = false
language-servers = ["ruff", "ty"]

#formatter = { command = "uvx", args = ["ruff", "format", "-"] }
formatter = { command = "sh", args = [
  "-c",
  "uvx ruff check --fix - | uvx ruff format -",
] }

# -------------------
# Ruff LSP
# -------------------
[language-server.ruff]
command = "uvx"
args = ["ruff", "server"]

# -------------------
# Ty LSP
# -------------------

[language-server.ty]
command = "uvx"
args = ["ty", "server"]
