# One link per line:   source:target[:profile]
# $(pwd) is the repo root. A source ending in /* links each file of that folder
# into target. profile (laptop or juno) limits the line to that machine; without
# it the line applies everywhere. Applied by scripts/symlinks.sh --create.
$(pwd)/bash/.bashrc:$HOME/.bashrc
$(pwd)/bash/aliases.bash:$HOME/.config/bash/aliases.bash
$(pwd)/bash/custom.bash:$HOME/.config/bash/custom.bash
$(pwd)/bash/git-completion.bash:$HOME/.config/bash/git-completion.bash
$(pwd)/bash/git-prompt.sh:$HOME/.config/bash/git-prompt.sh
$(pwd)/bash/miniforge3.bash:$HOME/.config/bash/miniforge3.bash
$(pwd)/bash/yabpc.bash:$HOME/.config/bash/yabpc.bash
$(pwd)/bin/*:$HOME/.local/bin
$(pwd)/claude/CLAUDE.md:$HOME/.claude/CLAUDE.md
$(pwd)/claude/settings.json:$HOME/.claude/settings.json
$(pwd)/helix:$HOME/.config/helix
$(pwd)/ruff:$HOME/.config/ruff
$(pwd)/systemd/*:$HOME/.config/systemd/user:laptop
$(pwd)/wezterm:$HOME/.config/wezterm:laptop
